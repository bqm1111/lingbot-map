# Gate 7A precommit. Written and SHA-256-pinned BEFORE the target-dependent
# analysis was run. Generated by tools/gate7a/precommit.py from gate7a/config.py,
# which the analysis imports, so config and code cannot drift apart.
gate:
  name: Gate 7A - completion reachability and oracle-envelope diagnosis
  kind: 'TARGET-DEPENDENT ORACLE ANALYSIS. Not a deployable prediction, not target-free inference. It
    produces no prediction artifact, and it neither alters nor weakens Gate 6''s target-free claim: the
    Gate-6 prediction rollup hashes are recorded before and after and must match.'
  nothing_is_trained: no optimizer, no backward pass, no neural network created or trained, no radius
    tuned on any target benchmark
  repo_commit: 9a648322e6dc4e34995f0530650c2fa469779676
  written_before_the_target_dependent_analysis_was_run: true
  seeds:
    bootstrap: 0
    global: 0
  forbidden:
  - no optimizer
  - no backward pass
  - no neural network created or trained
  - no radius tuned on any target benchmark
  - B-D unchanged
  - Trident unchanged
  - no teacher recaching
  - no frozen prediction modified
  - no new weights or datasets downloaded
  - C3 and V3 remain retired
  stop_conditions:
  - frozen Gate-6 prediction rollup or per-file hashes do not match
  - B-R/B-D geometry cannot be reproduced exactly from the frozen caches
  - the native Occ3D grid mapping is ambiguous
  - the exact camera-frame transformations cannot be verified
  - the frozen fused probability vectors are unavailable
  - the analysis would require retraining or rerunning a foundation model
  - a target-dependent quantity would enter a deployable prediction
frozen_inputs:
  occupancy: Gate-6 B-R and B-D, recomputed bit-identically from the frozen LingBot cache, the frozen
    G51-B scale table and the frozen Trident cache, and verified voxel-for-voxel against the pinned Gate-6
    prediction files before any analysis
  gauge: G51-B (frozen MoGe-2, calibrated horizontal FOV, one scalar per clip)
  scale_application: identical scalar on depth and on pose translation
  b_d: B-R plus the frozen dilate_r2 = 0.4 m; unchanged by this gate
  primary_condition: B-D
  teacher: Trident-H, frozen, not re-run; the Gate-6 cache is read only
  manifests:
    semantickitti: artifacts/scale_gate/manifests/val.jsonl
    occ3d: manifests/occ3d_zeroshot/val.jsonl
    kitti360: manifests/gate5_2/val.jsonl
  lingbot_cache:
    semantickitti: artifacts/scale_gate/cache/lingbot
    occ3d: /media/SSD1/MINH_DATASETS/lingbot_occ3d_zeroshot/cache_lingbot
    kitti360: /media/SSD1/MINH_DATASETS/lingbot_gate5_2/cache_lingbot
  semantic_cache_root: /media/SSD1/MINH_DATASETS/lingbot_gate6/semantics
  gate6_prediction_rollups:
    semantickitti: f8f8a66e9d66aa9d3dc641352e4417d8bad6087e164005da3ca14016be23abc5
    occ3d: 32fbe8c6b6677ec680597c3b85782dda60460275f4a8917b30fc6b4c5a634782
    kitti360: 2d6effe3b0e6b351f7a347821f631e6bc0c5a9daf05fb004123231221c28bbbf
  retired: C3, V3 and every previous learned occupancy corrector remain retired
