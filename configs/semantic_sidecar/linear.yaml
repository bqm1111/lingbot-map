paths:
  cache_root: output/semantic_sidecar/cache
  tracks_root: output/semantic_sidecar/tracks
  runs_root: output/semantic_sidecar/runs
  maps_root: output/semantic_sidecar/maps
  reports_root: output/semantic_sidecar/reports
lingbot:
  model_path: checkpoints/lingbot-map/204754b/lingbot-map.pt
  image_size: 518
  patch_size: 14
  mode: streaming
  num_scale_frames: 8
  keyframe_interval: 1
  enable_3d_rope: true
  max_frame_num: 1024
  kv_cache_sliding_window: 64
  use_sdpa: false
  camera_num_iterations: 4
  layers:
  - 11
  - 23
  device: cuda
  autocast_dtype: bfloat16
teacher:
  backend: maskclip
  model_name: ViT-B-16-quickgelu
  pretrained: openai
  variant: maskclip
  lseg_checkpoint: /home/minh/workspace/lang-seg/checkpoints/demo_e200.ckpt
  input_scale: 2.0
  embed_dim: 512
  pca_dim: 64
  pca_frames: 96
  pca_samples_per_frame: 2048
  device: cuda
tracks:
  voxel_token_scale: 1.5
  rel_voxel_size: 0.02
  metric_voxel_size: null
  anchor_frames: 32
  min_depth: 0.001
  max_depth_rel: 20.0
  conf_threshold: 1.3
  reproj_tol: 0.1
  min_observations: 3
  max_observations: 32
  outlier_mad_scale: 3.0
  min_teacher_obs: 1
  seed: 0
consensus:
  estimator: robust
  conf_power: 1.0
  residual_tau: 0.05
  angle_power: 1.0
  agreement_floor: 0.0
  fallback: invalid
model:
  arch: linear
  hidden_dim: 768
  num_blocks: 2
  mlp_ratio: 2.0
  dropout: 0.0
  out_dim: 64
  fuse: concat
loss:
  lambda_pixel: 0.0
  lambda_consensus: 1.0
  lambda_mv: 0.0
  lambda_rel: 0.0
  rel_group_size: 256
  rel_groups_per_batch: 4
  lambda_center: 0.0
train:
  steps: 20000
  frames_per_batch: 4
  tokens_per_frame: 1024
  lr: 0.001
  weight_decay: 0.0001
  warmup_steps: 100
  grad_clip: 1.0
  log_every: 1000
  val_every: 2000
  seed: 0
  device: cuda
  amp: true
  teacher_density: 1.0
  teacher_density_seed: 1234
  num_workers: 4
  resample_every: 8
  window: 24
  shard_cache_limit: 4
evaluation:
  kitti_root: data/kitti/dataset
  sequence: 08
  frame_stride: 5
  orig_width: 1226
  orig_height: 370
  depth_tolerance: 0.1
  grid_resolution: 4096
  min_count: 2
  pixel_stride: 2
  conf_threshold: 1.3
  sky_mask_dir: null
  extra_benchmarks:
    scannet:
      available: false
      root: null
      note: not present on this machine; adapter + config kept for the final run
    scannet200:
      available: false
      root: null
    replica:
      available: false
      root: null
      scenes:
      - office0
      - room0
    sab3r_map_and_locate:
      available: false
      root: null
    speira:
      available: false
      root: null
      note: qualitative sequences only
