# Gate 7B precommit. Written and SHA-256-pinned BEFORE the full evaluation.
# Generated by tools/gate7b/precommit.py from the modules the experiment imports.
gate:
  name: Gate 7B - native causal streaming replay, metric-gauge stability, complementary depth evidence
  nothing_is_trained:
  - no optimizer
  - no backward pass
  - no network created or trained
  - C3 and V3 remain retired
  - no local 3D completion network
  - no fixed-class semantic head
  - no per-benchmark parameter tuning
  - Trident is not re-run; its frame cache is read only
  - no Gate-6 or Gate-7A artifact is modified
  - no dataset file is written
  repo_commit: 9a648322e6dc4e34995f0530650c2fa469779676
  seeds:
    global: 0
    bootstrap: 0
  causality:
  - the map at timestamp t may use only frames with stream index <= t
  - 'LingBot''s own context is the native causal stream: its state is reset only at a genuine segment
    boundary, and its KV cache is causal by construction'
  - the temporal-recoverability analysis of Phase 6 looks forward and is diagnostic only; it is computed
    in a separate volume and never reaches a deployable output
  stop_conditions:
  - direct-mode streaming cannot be verified
  - dense MoGe outputs are unavailable or are the wrong metric gauge
  - a coordinate convention cannot be verified from the code
  - the projected full run exceeds 4 GPU-hours or 100 GB of new storage
  - a future frame could enter a causal prediction
  resource_limits:
    max_gpu_hours: 4.0
    max_new_storage_gb: 100.0
    action_if_exceeded: stop after the pilot and report the measured estimate; never launch an unbounded
      run
  semantic_caveat: the cached per-benchmark Trident probability vectors are used for evaluation only.
    A deployable open-vocabulary map must carry fixed-dimensional language-aligned descriptors, not permanent
    17/18/19-class probability vectors, or the open-vocabulary transfer claim of Gate 6 is lost.
streaming_interface:
  input_at_t: one current RGB image
  past_carried_by:
  - LingBot native anchor context (the 5 scale frames, pinned in the KV cache)
  - the pose-reference window (KV sliding window of 64 blocks)
  - trajectory / camera special tokens, cross-frame
  - the persistent metric occupancy-semantic map
  entry_point: lingbot_map.models.gct_stream.GCTStream.inference_streaming
  reset_policy: clean_kv_cache() exactly once per segment, at a genuine boundary
  rope:
    max_frame_num: 1024
    margin: 8
    keyframe_rule: the smallest keyframe_interval that fits the segment in the frozen RoPE table; a non-keyframe
      consumes no global frame index. Depends only on stream length and the frozen table size, never on
      a score.
  inference:
    resolution: 518
    patch_size: 14
    num_scale_frames: 5
    autocast: bfloat16
    checkpoint: checkpoints/lingbot-map/204754b/lingbot-map.pt
datasets:
  semantickitti:
    boundary_rule: 'one stream: SemanticKITTI odometry sequence 08. The Gate-6 clip set tiles the sequence
      at stride 5, so the stream is the 815 unique frames in odometry order.'
    evaluation_grid: semantickitti
    dims:
    - 256
    - 256
    - 32
    voxel_size_m: 0.2
    origin_m:
    - 0.0
    - -25.6
    - -2.0
    frame: velodyne_of_anchor_frame
    evaluated_timestamps: every official Gate-6 clip anchor, addressed as the causal prefix of the stream
      ending at that frame
  occ3d:
    boundary_rule: 150 streams, one per official nuScenes validation scene. A scene change is a genuine
      boundary; within a scene the frames are the unique CAM_FRONT samples in timestamp order.
    evaluation_grid: occ3d_nuscenes
    dims:
    - 200
    - 200
    - 16
    voxel_size_m: 0.4
    origin_m:
    - -40.0
    - -40.0
    - -1.0
    frame: ego_of_reference_sample
    evaluated_timestamps: every official Gate-6 clip anchor, addressed as the causal prefix of the stream
      ending at that frame
  kitti360:
    boundary_rule: 'one stream: KITTI-360 drive 2013_05_28_drive_0006_sync. The Gate-5.2 clip set slides
      by one frame, so the stream is the 1777 unique rectified frames in native index order.'
    evaluation_grid: sscbench_kitti360
    dims:
    - 256
    - 256
    - 32
    voxel_size_m: 0.2
    origin_m:
    - 0.0
    - -25.6
    - -2.0
    frame: velodyne_of_anchor_frame
    evaluated_timestamps: every official Gate-6 clip anchor, addressed as the causal prefix of the stream
      ending at that frame
horizons:
  causal:
  - 1
  - 5
  - 20
  - 50
  - all
  primary: all
  definition: frames [t-H+1, t] of the deduplicated stream, intersected with a purely geometric reach
    prefilter that can remove no contributing frame
scale_policies:
  primary: G-A
  estimator: per-frame median of log(D_moge) - log(D_lingbot) over jointly valid pixels after a 3.0 x
    MAD clip; at least 1000 valid pixels or the frame abstains
  G-A:
    rule: median over the stream's first 5 anchor frames, then frozen for the whole stream
    role: primary
  G-B:
    rule: expanding causal median over every candidate with index <= t
    role: comparison
  G-C:
    rule: each frame gauged by itself
    role: ABLATION ONLY; can never be selected as primary
  application: the same scalar multiplies LingBot depth and LingBot pose translation; rotations are never
    scaled
  rematerialisation: the metric crop at each evaluation timestamp is rebuilt from canonical observations
    with the scale in force at that timestamp, so a gauge change transforms old and new observations together
    and cannot duplicate surfaces
  moge_gauge: 'G51-B: full lattice, calibrated horizontal FOV, frozen MoGe-2'
depth_evidence_variants:
  S0: the frozen five-frame B-D prediction of Gate 6, read back unchanged
  S1:
    gate: conf >= 1.5, 1.0 m < s*d < 60.0 m
  S2:
    confidence_sweep:
    - 1.5
    - 1.0
    - 0.5
    - 0.25
    - 0.0
    primary: 0.5
    range: unchanged; the evaluation volume is 51.2 m across, so relaxing the 60 m cap cannot add a scorable
      voxel and is not attempted
    single_global_threshold: true
  S3:
    rule: LingBot where its frozen gate accepts; dense MoGe on the rays it rejects, if finite and inside
      the physical range
    weight: 0.5
    tracked_separately: true
  S4:
    rule: S3 with a continuous analytic reliability weight and a free-space veto
    tau_log: 0.5
    free_veto_logodds: -0.8
    min_weight: 0.05
    provisional: MoGe-only occupancy is provisional until 2 independent frames support it
occupancy_update:
  representation: occupied / free / unknown / provisional, per voxel
  rule: fixed log-odds accumulation, published OctoMap defaults, never tuned
  l_occ: 0.85
  l_free: -0.4
  clamp: 4.0
  occupied_at: log-odds > 0.0
  band_half_m: 0.2
  carve:
    near_m: 1.0
    pixel_stride: 4
    note: free space is carved from the near plane to band_half_m before the surface and NEVER beyond
      it; the region behind a predicted surface stays unknown
  source_weights:
    lingbot: 1.0
    moge: 0.5
semantic_update:
  teacher: the cached Gate-6 Trident probability vectors; Trident is NOT re-run
  rule: weighted sum of complete probability vectors on the surface voxel, argmax at readout
  weight: geometry reliability and observation quality -- LingBot confidence where LingBot supplied the
    ray, the MoGe reliability weight where MoGe did. NEVER the teacher's own maximum probability, which
    Gate 7A showed does not track propagation accuracy
  separation: semantic accumulators are separate from occupancy accumulators, so a geometry update never
    erases semantic history
  caveat: the cached per-benchmark Trident probability vectors are used for evaluation only. A deployable
    open-vocabulary map must carry fixed-dimensional language-aligned descriptors, not permanent 17/18/19-class
    probability vectors, or the open-vocabulary transfer claim of Gate 6 is lost.
ray_consistency:
  depth_convention: LingBot and MoGe both give optical-axis z on the processed lattice; a voxel's distance
    along a ray is Euclidean and is converted explicitly
  lingbot_units: canonical; metric only after multiplication by s(t)
  moge_units: already metric
  disagreement: '|log(D_moge) - log(s * D_lingbot)|'
  tau_log: 0.5
  free_veto_logodds: -0.8
aggregation:
  primary: pooled voxel counts over the whole benchmark (micro)
  metrics: gate6.metrics.clip_counts / summarize, unchanged, so every number is directly comparable with
    Gates 6 and 7A
  mean_per_clip: reported only where labelled
bootstrap:
  n_boot: 10000
  seed: 0
  alpha: 0.05
  units:
    occ3d: official nuScenes scene
    semantickitti: contiguous block of 20 clips (one drive)
    kitti360: contiguous block of 20 clips (one drive)
  block_size: 20
  independence_caveat: blocks from a single drive are not independent scenes and are never described as
    such
paired_comparisons:
- a: S0
  b: S1|G-A|all
  what: streaming accumulation against the frozen five-frame map
- a: S1|G-A|all
  b: S2|G-A|all
  what: relaxed LingBot gate
- a: S1|G-A|all
  b: S3|G-A|all
  what: MoGe rescue on rejected rays
- a: S1|G-A|all
  b: S4|G-A|all
  what: map-consistency-gated complementary fusion
- a: S1|G-A|all
  b: S1|G-B|all
  what: causal running-median gauge
- a: S1|G-A|all
  b: S1|G-C|all
  what: per-frame gauge (ablation only)
temporal_recoverability:
  horizons:
  - 1
  - 5
  - 10
  - 20
  - 50
  - any
  status: DIAGNOSTIC ONLY; future frames never enter a causal map
  isolation: computed in a separate volume, written to a separate artifact
range_bands_m:
- - 0
  - 10
- - 10
  - 20
- - 20
  - 30
- - 30
  - 40
- - 40
  - 60
