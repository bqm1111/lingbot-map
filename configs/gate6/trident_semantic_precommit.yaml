  lingbot: frozen; checkpoint sha256 ee665103348e07e6b826d529b8e61de8f413d5432a4f2e84970d6c8fd2e1cd72
  clip_length: 5
  anchor: last frame
  camera: single
  scale:
    gauge: G51-B
    teacher: frozen MoGe-2, calibrated horizontal FOV
    input: full image, no aspect crop
    granularity: one scalar per clip
    applied_to:
    - lingbot depth
    - pose translation
    rotations: unchanged
    distillation: none, MoGe stays at inference
  confidence_threshold: 1.5
  depth_range_m:
  - 1.0
  - 60.0
  correction:
    name: dilate_r2
    kind: dilate
    radius_voxels: 2
    canonical_voxel_size_m: 0.2
    physical_radius_m: 0.4
  forbidden:
  - C3
  - V3
  - any learned occupancy corrector
  - oracle scale
pixel_transform:
  chain:
  - native rectified image (H_n, W_n)
  - '-> Trident CLIP input: uniform keep_ratio resize, full extent'
  - -> Trident dense scores at native (H_n, W_n) via ori_shape
  - -> LingBot processed lattice (H_p, W_p) by one align_corners=False bilinear resize, then renormalised
    over classes
  justification: 'both lattices are full-extent resamplings of the same rectified image -- LingBot''s
    anisotropic (scale_gate.kitti.Preprocess: mode=''crop'' degenerates to a pure resize), Trident''s
    uniform -- so a single full-extent resize is the exact composition of the two pixel maps'
  point_pixel_provenance: each fused LingBot point carries (frame, v, u) on the processed lattice, reproducing
    voxel_gate.c3.c3_points bit-for-bit
  verification: synthetic pixel coordinates plus real overlays, in tests/gate6
lifting:
  per_point: sample the teacher probability vector at the point's own pixel
  voxel_rule: arithmetic mean of every contributing probability vector over all points and all five frames;
    NO confidence weighting, NO class prior, NO normalisation by frame count
  assignment: argmax of the fused mean probability vector
  outside_occupancy: predict empty; the frozen occupancy mask is never altered
  occ3d_native_reduction: predictions are built on the frozen canonical 0.2 m grid; a native 0.4 m voxel
    is occupied iff any of its eight subvoxels is (frozen rule) and takes the mean probability vector
    of its OCCUPIED subvoxels
  grid_conventions:
    semantickitti: SEMANTICKITTI_GRID, velodyne of anchor
    kitti360: SSCBENCH_KITTI360_GRID, velodyne of anchor
    occ3d: OCC3D canonical 0.2 m -> native 0.4 m, ego of anchor
occupancy_conditions:
  B-R: raw G51-B reconstruction
  B-D: G51-B + dilate_r2 (0.4 m)
  primary: B-D
  selected_per_dataset: false
  dilation_propagation:
    sources: raw-occupied voxels inside the same Chebyshev radius-2 neighbourhood
    select: the nearest source by Euclidean distance in voxel units
    ties: exact-distance ties are averaged (arithmetic mean of probability vectors), which is deterministic
      and order-independent
    propagate: the full probability vector, not the integer label
    ground_truth_used: none
evaluation:
  official_masks:
    semantickitti: target != 255; occupied := target != 0
    kitti360: 'official _1_1.npy: 255 ignore, 0 free, 1..18 occupied'
    occ3d: official labels.npz semantics with mask_camera applied, plus the frozen single-camera cut voxel_label[:100]
      = 255; free = 17
  metrics:
  - binary occupancy IoU
  - occupancy precision
  - occupancy recall
  - per-class semantic IoU
  - SSC mIoU excluding empty
  - per-class counts
  - empty prediction rate
  - TP-conditioned top-1 semantic accuracy
  - TP-conditioned macro/balanced recall
  - per-class recall
  - confusion matrix
  - evaluated voxel count per class
  error_decomposition:
    universe: every valid ground-truth OCCUPIED voxel
    categories:
    - 'coverage_miss: prediction empty'
    - 'naming_error: prediction occupied, wrong class'
    - 'correct: prediction occupied, right class'
    must_sum_to_one: true
  support_split:
    names:
    - reconstruction_support
    - dilation_only
    note: the first is NOT called visibility
  spatial_diagnostics:
    distance_bands_m:
    - - 0
      - 10
    - - 10
      - 20
    - - 20
      - 30
    - - 30
      - 40
    height_bands: per-dataset z bands over the grid extent
    reported:
    - semantic mIoU by distance
    - conditional accuracy by distance
    - coverage-miss fraction by distance
    - naming-error fraction by distance
    - raw-supported vs dilation-only accuracy
  cross_dataset_comparison: 'forbidden: grids, masks and protocols differ'
negative_controls:
  vocabulary_permutation:
    n_permutations: 100
    seed: 0
    per_dataset: true
    what_is_permuted: the class-to-text assignment only
    what_is_held_fixed: predicted occupancy, geometry, image features and the fused probability vectors;
      nothing is recomputed
    reported:
    - distribution and 95th percentile of full SSC mIoU
    - distribution and 95th percentile of TP-conditioned balanced semantic recall
    - percentile of the real vocabulary within the distribution
statistics:
  n_resamples: 10000
  seed: 0
  paired: true
  units:
    occ3d: scene (official nuScenes validation scenes)
    semantickitti: contiguous blocks of 20 clips of sequence 08
    kitti360: the Gate-5.2 contiguous blocks of 20 clips of sequence 06
  blocks_are_not_scenes: blocks come from a single sequence and are NOT described as independent scenes
  b_r_vs_b_d_intervals_for:
  - full SSC mIoU
  - TP-conditioned semantic accuracy
  - coverage-miss fraction
  - naming-error fraction
decision_rules:
  dataset_passes_semantic_transfer_iff_all:
  - correct-vocabulary full SSC mIoU > 95th percentile of the 100 permutations
  - correct-vocabulary TP-balanced recall > 95th percentile of the permutations
  - prediction generation is target-independent (auditor clean, tamper test passes)
  - official class mapping and evaluation pass all tests
  overall:
    FROZEN_TRIDENT_SEMANTICS_TRANSFER: all three datasets pass
    FROZEN_TRIDENT_SEMANTICS_PARTIAL: one or two datasets pass
    FROZEN_TRIDENT_SEMANTICS_FAIL: no dataset passes, or a leakage or protocol failure invalidates it
  bottleneck:
    COVERAGE_DOMINATES: B-D coverage-miss fraction > naming-error fraction on at least two datasets
    NAMING_DOMINATES: the reverse on at least two datasets
    MIXED_BOTTLENECK: neither
  binary_sanity_tolerance_abs: 0.0005
  binary_sanity_targets:
    semantickitti_B_D: 0.1584
    occ3d_B_D: 0.207
    kitti360_B_D: 0.1342
    kitti360_B_R: 0.0376
  not_rewritable_after_results: true
leakage:
  prediction_phase_is_target_free: true
  auditor_forbids:
  - .label
  - .invalid
  - _1_1.npy
  - _1_2.npy
  - _1_8.npy
  - labels.npz
  - velodyne
  - /voxels/
  - oracle_scale
  - scale_targets
  - lidar
  - gts/
  allowed_inputs:
  - RGB
  - calibration and poses
  - frozen LingBot outputs
  - frozen G51-B scale caches
  - frozen occupancy predictions
  - frozen teacher weights
  - dataset class schema
  ordering: every prediction is written to immutable files and the prediction manifest is SHA-256-pinned
    BEFORE the evaluator may open a target
  tamper_test: targets and LiDAR are randomised in a scratch tree and the deployable predictions must
    stay bit-identical
