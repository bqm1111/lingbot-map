      note: CLIP statistics, as trident_demo.py
    sam_input: the native file, read by the official code itself (cv2.imread(img_path)); Cityscapes half-split
      enabled
    ori_shape: native (H, W), as mmseg's LoadImageFromFile sets it before Resize; the dense output therefore
      lands at native resolution
  sam_refinement:
    enabled: true
    sam_model_type: vit_h
    coarse_thresh: 0.1
    minimal_area: 225
    sam_iou_thresh: 0.8
    sam_mask_coff: 0.005
    down_ratio: 2
    precision: float32
    upstream_defect_D1: 'trident.py:85 never assigns self.sam when sam_model_type==''vit_h'' and sam_refinement
      is True (the else branch is missing), so the predeclared large configuration cannot be constructed.
      The upstream file is NOT edited; the float32 SAM-H is installed post-construction, which is the
      state the missing branch would have produced (the inline comment cites segment-anything issue #540:
      ViT-H overflows in fp16).'
  prompt_mechanism:
    template: prompts.imagenet_template.openai_imagenet_template
    n_templates: 80
    aggregation: 'official: mean of L2-normalised text embeddings, then re-normalised'
    one_phrase_per_class: true
    synonyms: none
    alternatives_evaluated: none
  dense_score_extraction:
    point: 'the tensor the official hard label is taken from: the second return value of seg_utils.utils.map_refinement_coarse,
      i.e. refined_whole_logits, immediately before its argmax(0)'
    coarse_fallback: where refined_whole_logits.sum(0) == 0 the official code falls back to the coarse
      prediction, so the dense tensor uses the coarse softmax volume on exactly those pixels
    map_failed_regions: runs afterwards and rewrites the returned scores, but provably cannot move the
      label (it maxes the scores *before* comparing against them); the returned tensor is therefore NOT
      the one the label came from
    probability_conversion: coarse volume already carries the official temperature (logit_scale=40 then
      softmax over classes); the SAM-refined volume is non-negative and unnormalised, so it is divided
      by its per-pixel sum. Division by a positive scalar is strictly monotone, so the official argmax
      is preserved exactly. No second softmax.
    parity_requirement: argmax of the dense tensor must equal the official Trident prediction pixel-for-pixel
      on >= 100 deterministic images
  per_frame_independence: Trident is run once per unique RGB frame; no video tracking, no temporal smoothing
    in 2D
