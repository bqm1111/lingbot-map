# Phase-1 on Replica (indoor, rotation-dominated) -- the same pre-registered protocol
# and the same thresholds as configs/phase1.yaml, changing only the dataset.
# Replica ships no semantic labels, so boundary preservation uses the label-free
# depth-discontinuity definition (reported for KITTI too, for comparability).
seed: 0
device: cuda:0
output_dir: research/lingbot_semantic_memory/outputs/phase1_replica
cache_dir: research/lingbot_semantic_memory/outputs/cache_replica
teacher_budgets: [0.10, 0.25, 1.0]

data:
  dataset: replica
  root: data/Replica
  # 8 scenes of 2000 frames at 1200x680 -> one identical 21x37 patch grid.
  train_sequences: ["room0", "room1", "room2", "office0", "office1", "office2"]
  val_sequences: ["office4"]
  chunk_length: 64
  # Replica moves 9 mm / 0.63 deg per frame, so stride 1 would make "gap 1" two nearly
  # identical views. Stride 2 puts gap 1 at 1.25 deg and gap 24 at ~31 deg, a spread
  # comparable to the KITTI run's.
  stride: 2
  train_chunks_per_sequence: 1     # 6 x 64 = 384 training frames
  val_chunks: 3                    # 3 x 64 = 192 held-out frames
  image_size: 518
  patch_size: 14
  image_dirname: results

lingbot:
  model_path: checkpoints/lingbot-map/204754b/lingbot-map.pt
  image_size: 518
  patch_size: 14
  num_scale_frames: 8
  keyframe_interval: 1
  enable_3d_rope: true
  max_frame_num: 1024
  kv_cache_sliding_window: 64
  use_sdpa: false
  camera_num_iterations: 4
  autocast_dtype: bfloat16

teacher:
  hub_dir: /home/minh/.cache/torch/hub
  repo_subdir: facebookresearch_dinov2_main
  entrypoint: dinov2_vitb14_reg
  weights: checkpoints/dinov2_vitb14_reg4_pretrain.pth
  dim: 768
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

probe:
  target_params: 2000000     # matched across input widths by solving the hidden size
  max_params: 10000000
  steps: 4000
  batch_frames: 8
  lr: 0.001
  weight_decay: 0.01
  warmup_steps: 200
  grad_clip: 1.0
  amp_dtype: bfloat16

eval:
  short_gaps: [1, 2, 3]
  long_gaps: [8, 16, 24]
  occlusion_rel_tol: 0.05
  fb_tol_patches: 1.0
  conf_percentile: 25.0
  num_negatives: 4096
  max_pairs_per_chunk: 96

representations:
  - {name: lingbot_encoder,   kind: patch_embed, block: null, dim: 1024}
  - {name: lingbot_gct_b04,   kind: block,       block: 4,    dim: 2048}
  - {name: lingbot_gct_mid,   kind: block,       block: 11,   dim: 2048}
  - {name: lingbot_gct_b17,   kind: block,       block: 17,   dim: 2048}
  - {name: lingbot_gct_final, kind: block,       block: 23,   dim: 2048}
