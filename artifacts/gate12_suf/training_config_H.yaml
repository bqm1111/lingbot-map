# Gate 12 condition H (hard geometry). Identical to training_config_SUF.yaml except `input`.
# Recipe = configs/gate8c1_sky/seed0.yaml (adopted Gate 8C-1), geometry only.
input: H                        # channels [S_H, 0, F_H]
input_channels: [S, U, F]
base_config: configs/gate8c1_sky/seed0.yaml
train_drives: [2013_05_28_drive_0003_sync, 2013_05_28_drive_0007_sync, 2013_05_28_drive_0010_sync]
val_drive: 2013_05_28_drive_0006_sync
val_every_nth_anchor: 5         # training-time validation loss only (logged, never used for selection)
crop: [128, 128, 32]
width: 24
padding_mode: replicate
batch_size: 4
lr: 0.001
weight_decay: 0.01
grad_clip: 1.0
steps: 6000
log_every: 50
val_every: 500
ckpt_every: 1000
checkpoint_rule: final step (step 6000), no selection
sampler: uniform                # crop origin
anchor_sampling: uniform over all training anchors
centre_on_occ_p: 0.7            # unused by the uniform sampler
occ_loss: focal_dice
w_focal: 1.0
w_dice: 1.0
focal_gamma: 2.0
pos_weight_cap: 8.0
w_unknown: 2.0
observed_for_loss_weights: S_H or F_H   # identical tensor in both conditions
w_sem: 0.0                      # geometry only: no semantic input, target or loss
w_bce: 1.0                      # unused (occ_loss focal_dice)
lock_logodds: 2.0               # base log-odds is zero, so the residual lock never engages
seeds: [0, 1, 2]
