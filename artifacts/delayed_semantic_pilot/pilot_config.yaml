protocol: delayed_semantic_pilot/2026-09-14
train_drives:
- 2013_05_28_drive_0003_sync
- 2013_05_28_drive_0007_sync
- 2013_05_28_drive_0010_sync
dev_drive: 2013_05_28_drive_0006_sync
history_offsets:
- -4
- -3
- -2
- -1
- 0
geometry_seed: 0
head_seed: 0
logit_scale: 40.0
target:
  horizon_frames: 20
  horizon_s: 10.0
  min_camera_depth_m: 1.0
  zbuffer_cell_px: 4
  zbuffer_tol_m: 0.5
  zbuffer_tol_rel: 0.05
  persistence_min_span_s: 1.0
  lru_frames: 40
target_4s_variant:
  horizon_frames: 8
  horizon_s: 4.0
model:
  k_candidates: 16
  evidence_proj: 16
  hidden: 64
  path_samples: 8
  range_norm_m: 6.0
  trunk_channels: 24
train:
  steps: 3000
  anchors_per_step: 8
  hidden_queries: 2048
  delayed_queries: 2048
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  hide_block_vox:
  - 8
  - 8
  - 4
  hide_block_prob: 0.5
  log_every: 50
  ckpt_every: 1000
reliability_gate:
  G1_registration:
    offsets:
    - 1
    - 5
    - 10
    - 20
    median_max_m: 0.1
    p90_max_m: 0.2
  G2_coverage:
    mean_D_per_train_anchor_min: 2000
    classes_min: 8
    voxels_per_class_min: 10000
  G3_repeatability:
    train_agreement_min: 0.65
    train_margin_over_shuffle_min: 0.1
    dev_agreement_min: 0.6
    dev_margin_over_shuffle_min: 0.1
  G4_reobservation:
    agreement_min: 0.65
  tier_B_rule: tier B enters the delayed loss only if tier B alone meets G3 on the training drives
  stop_rule: 'any of G1-G4 failing for tier A => Stop: delayed targets are not reliable enough; nothing is trained'
decision:
  primary_region: completed_never_observed = GT occupied & predicted occupied & no student evidence in H_t
  K1:
    metric: mIoU(B2) - mIoU(B1)
    ci95_lower_above: 0.0
  K2:
    metric: mIoU(B2) - mIoU(B0)
    min_points: 2.0
    ci95_lower_above: 0.0
  K3: predictions on evidence voxels identical across methods
  K4:
    min_classes_positive_gain_vs_B0: 5
    gain_without_largest_class_above: 0.0
  K5: ssc_full mIoU(B2) >= ssc_full mIoU(B0)
  K6: occupancy TP/FP/FN identical to the frozen seed-0 counts of Gate 15 source evaluation
  bootstrap:
    block_anchors: 20
    resamples: 2000
    seed: 0
  outcomes:
    proceed: K1-K6 all pass
    stop: reliability gate fails
    revise: otherwise
frozen_stages:
