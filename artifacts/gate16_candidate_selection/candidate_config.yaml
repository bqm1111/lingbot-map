protocol: gate16_candidate_selection/2026-09-14
k_candidates: 16
candidate_rule: 16 nearest observed evidence voxel centres, Euclidean, ascending (model.nearest_candidates)
tau_target: 0.025
compatibility: r_i = <p_i, q_v>, p_i = softmax(40 cos(f_i, text)), q_v = delayed target distribution
seeds:
- 0
- 1
- 2
variants:
  B3:
    semantic_projection: true
  B3geom:
    semantic_projection: false
train:
  steps: 3000
  anchors_per_step: 8
  hidden_queries: 2048
  delayed_queries: 2048
  lr: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  hide_block_vox:
  - 8
  - 8
  - 4
  hide_block_prob: 0.5
  log_every: 50
  ckpt_every: 1000
model:
  k_candidates: 16
  evidence_proj: 16
  hidden: 64
  path_samples: 8
  range_norm_m: 6.0
  trunk_channels: 24
delayed_targets: pilot delayed_targets (10 s, tiers A+B), reused unchanged
selection_threshold:
  N_nearest_candidate_acc: 0.46002642158170787
  O_oracle_acc: 0.5731547543536555
  H: 0.11312833277194762
  T: 0.5165905879676816
  required_recovered_fraction: 0.5
geometry_seed: 0
pilot_controls:
  B1: artifacts/delayed_semantic_pilot/checkpoints/B1_seed0_step03000.pt
  B2: artifacts/delayed_semantic_pilot/checkpoints/B2_seed0_step03000.pt
