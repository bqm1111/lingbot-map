experiment: baseline_reconstruction/2026-09-14
dataset: occ3d
protocol:
  dataset: occ3d
  stream_rule: 150 official validation scenes, CAM_FRONT samples in timestamp order, one stream per scene; anchor = every
    sample with a label; clip = stream indices i-4..i
  camera: CAM_FRONT only (the frozen single-camera protocol)
  prediction_grid: canonical 400x400x32 @ 0.2 m, origin (-40, -40, -1), ego frame of the anchor sample
  evaluation_grid: native 200x200x16 @ 0.4 m
  evaluation_mask: mask_camera == 1, lidar mask off, ego x-index < 100 ignored (single front camera)
  occupancy_target: semantics != 17 (free) inside the mask
  reduction: native voxel occupied iff any of its 8 canonical subvoxels is occupied
  anchors_expected: 1182
clip_offsets:
- -4
- -3
- -2
- -1
- 0
input_frame_construction: local-reset LingBot on the five target images, clip-local indices 0..4, KV cache cleared; causal
  MoGe-2 clip scale from the frozen per-frame MoGe-B caches; anchor camera = identity
camera_preprocessing: 'gates/gate7b/replay.load_images: mode=''crop'', 518 px, patch 14 (identical to the stream and to KITTI-360
  clips)'
coordinate_transform: grid -> world(anchor camera) = inv(T_cam_to_grid); T_camera_to_ego of the anchor sample
occupancy_threshold: 0.0
checkpoint_rule: final step 6000, three seeds, mean primary / median secondary
checkpoints:
  '0': artifacts/baseline_reconstruction/checkpoints/geo_seed0_step06000.pt
  '1': artifacts/baseline_reconstruction/checkpoints/geo_seed1_step06000.pt
  '2': artifacts/baseline_reconstruction/checkpoints/geo_seed2_step06000.pt
